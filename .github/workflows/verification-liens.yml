name: Vérification des liens

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"   # chaque lundi à 7h (UTC)
  workflow_dispatch:       

jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les liens
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude "kca-domaine-a-remplacer.example"
            './**/*.html'
          fail: true
